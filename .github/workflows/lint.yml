name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # windows-latest on purpose. These scripts target Windows PowerShell 5.1,
    # and several of the things they guard against are 5.1 specific: no
    # TickCount64, a BOM from Out-File -Encoding utf8, cp1252 console output.
    runs-on: windows-latest

    steps:
      # v5, not v4. v4 targets Node 20, which GitHub now force-runs on Node 24
      # and warns about on every run.
      - uses: actions/checkout@v5

      - name: Syntax
        shell: powershell
        run: .\.ci\Test-Syntax.ps1

      - name: ASCII only
        shell: powershell
        run: .\.ci\Test-Ascii.ps1

      - name: No undefined variables
        shell: powershell
        run: .\.ci\Test-UndefinedVars.ps1

      - name: Toolkit version agreement
        shell: powershell
        run: .\.ci\Test-Version.ps1

      - name: Shared region in sync
        shell: powershell
        run: .\.ci\Test-RegionSync.ps1

      - name: Backup purge decision
        shell: powershell
        run: .\.ci\Test-BackupLogic.ps1

      - name: Parser and arithmetic logic
        shell: powershell
        run: .\.ci\Test-ParserLogic.ps1

      - name: Launcher exit codes
        shell: powershell
        run: .\.ci\Test-BatExitCodes.ps1

      - name: Elevation forwarding
        shell: powershell
        run: .\.ci\Test-Elevation.ps1

      - name: A start is always attempted
        shell: powershell
        run: .\.ci\Test-AlwaysTriesStart.ps1

      - name: Generated launchers parse
        shell: powershell
        run: .\.ci\Test-GeneratedLaunchers.ps1

      - name: Only the desktop app is killed
        shell: powershell
        run: .\.ci\Test-ProcessInventory.ps1

      - name: Data and log discovery
        shell: powershell
        run: .\.ci\Test-DataDiscovery.ps1

      - name: Only VM error lines start a repair
        shell: powershell
        run: .\.ci\Test-LogTriggers.ps1

      - name: Prevent's steps against fakes
        shell: powershell
        run: .\.ci\Test-PreventSteps.ps1

      - name: How Fix runs end, the clock check and UTC ages
        shell: powershell
        run: .\.ci\Test-RunOutcomes.ps1

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module PSScriptAnalyzer
          $targets = @(
            'Fix-ClaudeDesktop.ps1',
            'Watch-ClaudeHealth.ps1',
            'Prevent-ClaudeIssues.ps1'
          )
          $all = @()
          foreach ($t in $targets) {
            $all += @(Invoke-ScriptAnalyzer -Path $t -Settings .\PSScriptAnalyzerSettings.psd1)
          }
          if ($all.Count -gt 0) {
            $all | Format-Table Severity, ScriptName, Line, RuleName, Message -AutoSize -Wrap
            Write-Host ("PSScriptAnalyzer: {0} finding(s)" -f $all.Count)
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean"
